<title>MPL 주식 리그</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: clean white board with soft tinted cards. Home = index card + ranking card; stocks/wallet/feed in tabs; a long rounded bar floats above the bottom nav with my total. Single light theme by choice. */
:root{
  --bg:#ffffff; --paper:#f5f5f9; --paper2:#ebebf2; --ink:#17161f; --dim:#747386; --faint:#adacbd; --line:#ececf2;
  --up:#f2414f; --up-bg:#fdeced; --down:#2f78ee; --down-bg:#e9f0fd;
  --violet:#6a4cf5; --violet-bg:#f0edff; --mint:#16b27e; --mint-bg:#e3f6ee; --gold:#f2b300; --gold-bg:#fff6dc;
  --f-body:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-game:var(--f-body);
  --gut-l:max(16px,env(safe-area-inset-left,0px)); --gut-r:max(16px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:var(--gut-l);padding-right:var(--gut-r);padding-block:10px calc(150px + env(safe-area-inset-bottom,0px));overflow-x:hidden;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.wrap{max-width:520px;margin-inline:auto}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.g{font-weight:800}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--dim)} .dim{color:var(--dim)}
h2{font-size:18px;font-weight:800;margin:0;letter-spacing:-.02em;text-wrap:balance}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-h small{color:var(--faint);font-size:12.5px;font-weight:600}
.card{background:var(--paper);border-radius:22px}
.press:active{opacity:.7}

/* top bar */
.top{display:flex;align-items:center;gap:8px;padding:4px 0 12px}
.logo{font-size:23px;font-weight:800;letter-spacing:-.04em;line-height:1}
.logo i{font-style:normal;color:var(--violet)}
.round{font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--violet-bg);color:var(--violet)}
.helpbtn{margin-left:auto;width:34px;height:34px;border-radius:50%;font-weight:800;font-size:15px;background:var(--paper);color:var(--dim)}

/* timer */
.timer{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--ink);color:var(--bg);border-radius:18px}
.timer .lab{font-size:12px;opacity:.6;font-weight:600}
.timer .nm{font-size:15px;font-weight:700}
.timer .cd{margin-left:auto;font-size:22px;font-weight:800;letter-spacing:-.01em}
.rounds{display:flex;gap:3px;margin-top:8px}
.rounds i{flex:1;height:4px;border-radius:2px;background:var(--paper2)}
.rounds i.done{background:var(--violet)} .rounds i.now{background:var(--violet);opacity:.35}
.rounds i.gap{margin-left:4px}

/* index */
.index{padding:18px 18px 12px;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.index .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.index .lab{font-size:13px;font-weight:700;color:var(--dim)}
.index .v{font-size:clamp(34px,10.5vw,42px);font-weight:800;line-height:1.1;letter-spacing:-.03em}
.index .c{font-size:15px;font-weight:700}
.mood{font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:99px;white-space:nowrap;background:var(--bg)}
.mood.up{color:var(--up)} .mood.down{color:var(--down)} .mood.flat{color:var(--dim)}
.ichart{width:100%;height:110px;display:block;margin-top:6px}
.sectors{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.sectors div{background:var(--bg);border-radius:12px;padding:7px 4px;text-align:center;font-size:11.5px;font-weight:600;color:var(--dim);min-width:0}
.sectors b{display:block;font-size:13.5px;font-weight:800}
.join{display:flex;flex-direction:column;gap:6px;padding:18px;text-align:center;background:var(--violet-bg)}
.join b{font-size:18px;font-weight:800}

/* avatars */
.ava{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:800;color:var(--ink);flex:none}
.ava.lg{width:52px;height:52px;font-size:20px}
.ava .crown{display:none}

/* rival */
.rival{padding:14px 16px;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.rival-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:700}
.rival-top .g{font-size:14px}
.tug{position:relative;height:8px;border-radius:99px;background:var(--down);overflow:hidden}
.tug i{position:absolute;inset:0 auto 0 0;background:var(--up);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.tug::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--bg)}

/* leaderboard */
.lb{display:flex;flex-direction:column;padding:6px;gap:2px}
.lrow{display:grid;grid-template-columns:26px 38px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;width:100%;text-align:left;border-radius:16px}
.lrow.isme{background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--violet)}
.lrow .rk{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--dim)}
.lrow .rk.r1{background:var(--gold);color:#fff} .lrow .rk.r2{background:#a7adbb;color:#fff} .lrow .rk.r3{background:#cf8d5a;color:#fff}
.lrow .who{min-width:0}
.lrow .who b{font-size:15px;font-weight:700}
.lrow .who small{display:block;font-size:12px;color:var(--dim);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .r{text-align:right}
.lrow .r b{font-size:15px;font-weight:800}
.lrow .r small{display:block;font-size:12.5px;font-weight:700}
.mv{font-size:11.5px;font-weight:800;margin-left:4px}
.tag{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:6px;margin-left:4px;vertical-align:2px}
.tag.rv{background:var(--up-bg);color:var(--up)} .tag.bot{background:var(--paper2);color:var(--dim)} .tag.you{background:var(--violet);color:#fff}

/* news */
.news{display:flex;flex-direction:column;gap:6px}
.nrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--paper)}
.src{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--bg);color:var(--dim);white-space:nowrap}
.src.공시{background:var(--mint-bg);color:var(--mint)} .src.기사{background:var(--violet-bg);color:var(--violet)} .src.긴급{background:var(--ink);color:#fff}
.nrow .t{font-size:14.5px;font-weight:700;line-height:1.4}
.nrow .t small{display:block;font-size:12px;font-weight:500;color:var(--dim)}
.nrow.shock{background:var(--gold-bg)}

/* chips */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1 * var(--gut-l)) calc(-1 * var(--gut-r));padding:2px var(--gut-r) 2px var(--gut-l)}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;font-size:13.5px;font-weight:700;padding:7px 13px;border-radius:99px;background:var(--paper);color:var(--dim)}
.chips button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* stock rows */
.slist{display:flex;flex-direction:column}
.srow{display:flex;align-items:center;gap:8px;padding:8px 0}
.srow-main{flex:1;min-width:0;display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:10px;text-align:left}
.srow-main:active{opacity:.6}
.tbtns{display:flex;gap:4px;flex:none}
.tb{font-size:12.5px;font-weight:800;padding:8px 9px;border-radius:10px}
.tb.buy{background:var(--up-bg);color:var(--up)} .tb.sell{background:var(--down-bg);color:var(--down)}
.tb:disabled{opacity:.3;cursor:default}
.sprice .p{border-radius:6px;padding:0 3px;margin-right:-3px}
.sprice .p.fu{animation:fu .9s} .sprice .p.fd{animation:fd .9s}
@keyframes fu{0%{background:var(--up-bg);color:var(--up)}}
@keyframes fd{0%{background:var(--down-bg);color:var(--down)}}
.livedot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--up);margin-left:8px;vertical-align:middle;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.2}}
.seg.two{grid-template-columns:1fr 1fr}
.sheet-wrap.center{align-items:center;padding:16px}
.sheet-wrap.center .sheet{border-radius:24px;max-width:400px;padding:18px 18px 18px;animation:pop .22s}
.sheet-wrap.center .grab{display:none}
.logo-b{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:12.5px;font-weight:800;letter-spacing:-.03em;flex:none}
.sname{min-width:0}
.sname b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sname small{display:block;font-size:12.5px;color:var(--dim);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sname .mine{color:var(--violet);font-weight:700}
.sprice{text-align:right}
.sprice .p{font-size:15px;font-weight:700}
.sprice .c{font-size:13px;font-weight:700}

/* wallet */
.cards2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{padding:14px 16px}
.stat .lab{font-size:12.5px;color:var(--dim);font-weight:600}
.stat .v{font-size:18px;font-weight:800;margin-top:2px}
.pos{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;width:100%;text-align:left}
.pos .r{text-align:right}
.pos .r b{font-weight:800}
.pos small{font-size:12.5px;font-weight:600}
.empty{padding:26px 16px;text-align:center;color:var(--dim);font-size:14px;font-weight:600;background:var(--paper);border-radius:18px}

/* feed */
.fitem{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;font-size:14px}
.fitem .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:14px;background:var(--paper)}
.fitem .ic.up{background:var(--up-bg)} .fitem .ic.down{background:var(--down-bg)} .fitem .ic.gold{background:var(--gold-bg)}
.fitem time{font-size:12px;color:var(--faint);white-space:nowrap;font-weight:600}
.fitem small{color:var(--dim);font-size:12.5px;font-weight:500}
.verdict{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:8px;white-space:nowrap}
.verdict.t{background:var(--mint-bg);color:var(--mint)} .verdict.f{background:var(--up-bg);color:var(--up)} .verdict.g{background:var(--ink);color:#fff}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:6px var(--gut-r) calc(6px + env(safe-area-inset-bottom,0px)) var(--gut-l);background:rgba(255,255,255,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.nav-in{max-width:520px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{padding:6px 4px 4px;font-size:11.5px;font-weight:700;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-selected="true"]{color:var(--ink)}
.nav .dot{position:absolute;top:4px;right:calc(50% - 16px);width:7px;height:7px;border-radius:50%;background:var(--up)}

/* payout */
.bonus{display:flex;align-items:center;gap:12px;padding:14px 16px}
.bonus .t{flex:1;min-width:0}
.bonus .t b{display:block;font-size:15px;font-weight:800}
.bonus .t small{font-size:12.5px;color:var(--dim);font-weight:600}
.bonus button{flex:none;padding:10px 18px;border-radius:12px;background:var(--violet);color:#fff;font-weight:800;font-size:14px}
.bonus button:disabled{background:var(--paper2);color:var(--dim);cursor:default}
.bonus{background:var(--violet-bg)}
.bonus-amt{flex:none;font-size:15px;font-weight:800;color:var(--violet)}
.lb-gap{text-align:center;color:var(--faint);font-weight:800;letter-spacing:.2em;padding:2px 0}

/* casino */
.bal{display:flex;justify-content:space-between;align-items:center;padding:14px 16px}
.bal b{font-size:22px;font-weight:800}
.betrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.betrow button{background:var(--paper);border-radius:12px;padding:10px 0;font-weight:800;font-size:14px;color:var(--dim)}
.betrow button[aria-pressed="true"]{background:var(--ink);color:#fff}
.betrow button:disabled{opacity:.35}
.game{padding:18px 16px;display:flex;flex-direction:column;gap:12px}
.game h3{margin:0;font-size:17px;font-weight:800}
.game .desc{font-size:12.5px;color:var(--dim);font-weight:500;margin:2px 0 0}
.game .res{text-align:center;font-size:15px;font-weight:700;margin:0;min-height:22px}
.coin{width:104px;height:104px;margin:4px auto 0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe58a,#f2b300 72%);display:grid;place-items:center;font-size:30px;font-weight:800;color:#7a5600;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12)}
.coin.spin{animation:flip .95s cubic-bezier(.3,.7,.4,1)}
@keyframes flip{0%{transform:rotateY(0) translateY(0)}50%{transform:rotateY(900deg) translateY(-34px)}100%{transform:rotateY(1800deg) translateY(0)}}
.pick2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wheel-wrap{position:relative;width:240px;height:240px;margin:14px auto 0;max-width:100%}
.wheel{position:absolute;inset:0;border-radius:50%;transition:transform 2.8s cubic-bezier(.12,.8,.18,1);box-shadow:0 0 0 5px var(--bg),0 0 0 7px var(--paper2)}
.wheel span{position:absolute;left:50%;top:50%;width:0;height:0}
.wheel span i{position:absolute;transform:translate(-50%,-50%);font-style:normal;font-weight:800;font-size:13.5px;color:var(--ink);white-space:nowrap}
.pointer{position:absolute;left:50%;top:-14px;transform:translateX(-50%);width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:20px solid var(--ink);z-index:2}
.hub{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:var(--bg);box-shadow:0 0 0 3px var(--paper2)}

/* floating total-asset bar */
.fab{position:fixed;z-index:25;left:0;right:0;margin-inline:auto;width:calc(100% - var(--gut-l) - var(--gut-r));max-width:520px;
  bottom:calc(70px + env(safe-area-inset-bottom,0px));height:58px;border-radius:18px;background:var(--ink);color:#fff;
  box-shadow:0 8px 24px rgba(23,22,31,.22);display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:0 16px;text-align:left;transition:transform .1s}
.fab:active{transform:scale(.98)}
.fab .rk{min-width:40px;height:32px;padding:0 8px;border-radius:10px;background:rgba(255,255,255,.12);display:grid;place-items:center;font-size:14px;font-weight:800}
.fab .rk.r1{background:var(--gold);color:var(--ink)}
.fab .mid{min-width:0;display:flex;flex-direction:column;line-height:1.2}
.fab .l{font-size:11.5px;font-weight:600;opacity:.6}
.fab .v{font-size:18px;font-weight:800}
.fab .c{font-size:15px;font-weight:800;text-align:right}
.fab .c.up{color:#ff7a85} .fab .c.down{color:#7fb0ff} .fab .c.flat{color:rgba(255,255,255,.6)}
.fab.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.03)}}

/* stock detail page */
.detail{position:fixed;inset:0;z-index:35;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;
  padding:env(safe-area-inset-top,0px) var(--gut-r) calc(96px + env(safe-area-inset-bottom,0px)) var(--gut-l);animation:slidein .22s cubic-bezier(.2,.8,.2,1)}
@keyframes slidein{from{transform:translateX(24px);opacity:0}}
.detail .in{max-width:520px;margin:auto;display:flex;flex-direction:column;gap:18px}
.dtop{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:10px 0;background:var(--bg)}
.dtop .back{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;margin-left:-6px}
.dtop .back svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.dtop b{font-size:16px;font-weight:800}
.dhead{display:flex;gap:12px;align-items:center}
.dhead .logo-b{width:52px;height:52px;font-size:16px;border-radius:15px}
.dhead h1{font-size:22px;font-weight:800;margin:0;letter-spacing:-.02em;line-height:1.2}
.dhead small{color:var(--dim);font-size:13px;font-weight:600}
.dprice .p{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.dprice .c{font-size:15px;font-weight:700;margin-top:2px}
.dchart{width:100%;height:190px;display:block}
.drange{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);font-weight:700;margin-top:-10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats div{background:var(--paper);border-radius:14px;padding:11px 13px;font-size:12.5px;color:var(--dim);font-weight:600;min-width:0}
.stats b{display:block;color:var(--ink);font-size:15.5px;font-weight:800;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mypos{padding:16px;display:flex;flex-direction:column;gap:10px}
.mypos .r{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:600}
.mypos .r span:first-child{color:var(--dim)}
.mypos .r b{font-weight:800}
.dbar{position:fixed;left:0;right:0;bottom:0;z-index:36;padding:10px var(--gut-r) calc(10px + env(safe-area-inset-bottom,0px)) var(--gut-l);background:rgba(255,255,255,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.dbar .in{max-width:520px;margin:auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.dbar .cta{padding:14px 6px;font-size:15.5px}
body.noscroll{overflow:hidden}
.mypos .r span:first-child{font-size:13px}
.vote{padding:16px;display:flex;flex-direction:column;gap:10px}
.vq b{display:block;font-size:15.5px;font-weight:800}
.vq small{font-size:12.5px;color:var(--dim);font-weight:600}
.vbar{height:8px;border-radius:99px;background:var(--down);overflow:hidden}
.vbar i{display:block;height:100%;background:var(--up);transition:width .5s}
.vbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vb{padding:11px;border-radius:12px;font-weight:800;font-size:14.5px;background:var(--bg)}
.vb.up{color:var(--up)} .vb.down{color:var(--down)}
.vb.up.on{background:var(--up);color:#fff} .vb.down.on{background:var(--down);color:#fff}
.vb:disabled{opacity:.45;cursor:default}
.composer{display:flex;gap:8px}
.composer input{flex:1;min-width:0;background:var(--paper);border:0;border-radius:14px;padding:13px 14px;font-family:var(--f-body);font-size:15px;font-weight:600;color:var(--ink)}
.composer button{flex:none;width:48px;border-radius:14px;background:var(--violet);color:#fff;display:grid;place-items:center}
.chat{background:var(--paper);border-radius:20px;padding:12px 12px 8px;height:min(420px,56vh);overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:3px}
.chat-empty{margin:auto;color:var(--dim);font-size:14px;font-weight:600}
.chat-day{align-self:center;font-size:11.5px;font-weight:700;color:var(--faint);padding:8px 0 4px}
.msg{display:flex;gap:8px;align-items:flex-start;max-width:86%;margin-top:6px}
.msg.cont{margin-top:0}
.msg .ava{width:32px;height:32px;font-size:13px}
.ava-sp{width:32px;flex:none}
.msg .mb{min-width:0;display:flex;flex-direction:column;gap:3px}
.msg .mn{font-size:12.5px;font-weight:700;color:var(--dim);display:flex;align-items:center;gap:4px}
.mrow{display:flex;align-items:flex-end;gap:5px}

}

  const X = i => padX + (w - padX * 2) * i / NT, Y = v => padT + (h - padT - padB) * (1 - (v - lo) / span);

  g.beginPath(); arr.forEach((v, i) => i ? g.lineTo(X(i), Y(v)) : g.moveTo(X(i), Y(v))); if (L) g.lineTo(X(L.x), Y(L.v));

}

function renderReveal(b, sh) {
  const { from, to } = sh; const n = to - from; const I = S.SE.index; const ic = I[to] / I[from] - 1;
  let h = `<div class="rv-head"><span class="k">${n > 1 ? `라운드 ${n}개 지나감` : `ROUND ${to} 종료`}</span><h3>${tickLabel(to)} 결과</h3></div>`;
  h += `<div class="info"><div>MPL 종합지수<b class="num ${cls(ic)}">${I[to].toFixed(1)} ${pctTxt(ic)}</b></div><div>분위기<b>${moodOf(ic)[1]}</b></div></div>`;
  if (S.me) {
    const w0 = worth(S.me, from), w1 = worth(S.me, to), d = w1 - w0;
    const r0 = ranking(from), r1 = ranking(to); const i0 = r0.findIndex(p => p.id === S.uid), i1 = r1.findIndex(p => p.id === S.uid);
    h += `<div class="card rv-me"><div class="dim" style="font-size:13px;font-weight:700">내 자산 변화</div><div class="v num ${cls(d)}" id="rvCount">${signWon(0)}</div><div class="rv-rank">${i0 + 1}위 → ${i1 + 1}위 ${i1 < i0 ? `<span class="up">▲${i0 - i1}</span>` : i1 > i0 ? `<span class="down">▼${i1 - i0}</span>` : '<span class="dim">유지</span>'}</div></div>`;

    r1.slice(i1 + 1).filter(p => r0.findIndex(x => x.id === p.id) < i0).forEach(p => h += `<div class="overtake good">😎 ${esc(p.name)}님을 제쳤어요</div>`);
    sh.countTo = d;
  }
  const mine = S.me ? new Set([...Object.keys(S.me.hold || {}), ...Object.keys(S.me.shorts || {})]) : new Set();
  const moves = STOCKS.map(s => ({ s, c: chg(s.id, from, to) })).sort((a, b) => b.c - a.c);
  const pickList = [...moves.filter(x => mine.has(x.s.id)), ...moves.slice(0, 3), ...moves.slice(-3)].filter((x, i, a) => a.findIndex(y => y.s.id === x.s.id) === i);
  h += `<div class="sec"><div class="sec-h"><h2>${mine.size ? '내 종목 · 급등락' : '급등 · 급락'}</h2></div><div class="slist">`;
  pickList.forEach(({ s, c }, i) => {
    h += `<div class="rv-row" style="animation-delay:${.1 + i * .06}s">${badge(s)}<span class="sname"><b>${esc(s.n)}${mine.has(s.id) ? ' <small class="mine" style="display:inline">· 보유</small>' : ''}</b><small class="dim num">${px(s.id, from).toLocaleString()} → ${px(s.id, to).toLocaleString()}</small></span><span class="chg num ${cls(c)}">${pctTxt(c)}</span></div>`;
  });
  h += `</div></div><button class="cta" type="button" id="revealOk">확인</button>`;
  b.innerHTML = h;
  const el = $('#rvCount'); if (el && sh.countTo != null) { const target = sh.countTo, t0 = performance.now();
    const step = t => { const f = Math.min(1, (t - t0) / 900), e = 1 - Math.pow(1 - f, 3); el.textContent = signWon(target * e); if (f < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step); }
}
function maybeReveal() {

  if (seen == null) { LS.set(key, S.tick); return false; }
  if (S.tick > seen) { LS.set(key, S.tick); openSheet('reveal', { from: seen, to: S.tick }); return true; }
  return false;
}
function maybeJoin() {
  if (S.me || S.readOnly || S.joinShown || S.sheet || S.mode === 'loading') return;

  S.joinShown = true; openSheet('join');

/* ───────── persistence ───────── */
let saveChain = Promise.resolve();
function saveMe(me, before) {
  S.me = me; S.players[S.uid] = me;
  const run = async () => {
    if (S.mode === 'demo') { LS.set('demo2:' + S.season.sid, me); return true; }
    try { await S.db.doc('players/' + S.uid).set(me); return true; }
    catch (e) {
      S.me = before || null; if (before) S.players[S.uid] = before; else delete S.players[S.uid];
      if (e && e.code === 'invalid_argument') { S.readOnly = true; toast('관전 모드예요. 방장에게 편집자 초대를 받아야 거래할 수 있어요.'); }
      else if (e && e.code === 'quota_exceeded') toast('저장 공간이 가득 찼어요. 방장에게 알려주세요.');
      else toast('저장하지 못했어요. 잠시 후 다시 해주세요.');
      renderAll(); return false;
    }
  };
  const p = saveChain.then(run); saveChain = p.catch(() => {}); return p;
}
function addFeed(f) {
  const item = { ...f, uid: S.uid, season: S.season.sid, ts: Date.now() };
  if (S.mode === 'demo') { S.feed.unshift(item); LS.set('demoFeed2:' + S.season.sid, S.feed.filter(x => !x.bot)); return; }
  S.db.collection('feed').add(item).catch(() => {});
}

/* ───────── demo mode ───────── */
function makeBots() {
  const R = rng('bots2:' + S.season.sid); const names = ['존버왕', '단타의신', '물타기장인']; const out = {};
  names.forEach((n, i) => {
    const p = { name: n, bot: true, season: S.season.sid, cash: CASH0, hold: {}, cost: {}, shorts: {} };
    const order = STOCKS.map(s => ({ s, r: R() })).sort((a, b) => a.r - b.r).map(x => x.s).slice(0, 2 + Math.floor(R() * 3));
    order.forEach(s => { const q = Math.floor(CASH0 * (.15 + R() * .2) / s.p0); if (!q) return; p.hold[s.id] = q; p.cost[s.id] = s.p0; p.cash -= q * s.p0; });
    if (R() < .6) { const s = STOCKS[Math.floor(R() * STOCKS.length)]; const q = Math.floor(CASH0 * .1 / s.p0); if (!p.hold[s.id] && q && p.cash > q * s.p0) { p.shorts[s.id] = { q, e: s.p0 }; p.cash -= q * s.p0; } }
    out['bot' + i] = p;
  });
  return out;
}
function loadDemo() {

  ]);

/* ───────── live mode ───────── */
async function boot() {
  syncTime(); S.lastLive = liveStep(now()); S.bet = LS.get('bet', 500000); S.slot = slotOf(now()); S.rival = LS.get('rival', null); S.feedSeen = LS.get('feedSeen', 0); renderAll();

  }
});
