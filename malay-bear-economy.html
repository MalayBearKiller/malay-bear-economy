<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>곰스피</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2732%27 fill=%27%23f6d78b%27/%3E%3Ccircle cx=%2715%27 cy=%2717%27 r=%278%27 fill=%27%232b211c%27/%3E%3Ccircle cx=%2749%27 cy=%2717%27 r=%278%27 fill=%27%232b211c%27/%3E%3Ccircle cx=%2715%27 cy=%2717%27 r=%273.5%27 fill=%27%237a5a40%27/%3E%3Ccircle cx=%2749%27 cy=%2717%27 r=%273.5%27 fill=%27%237a5a40%27/%3E%3Cellipse cx=%2732%27 cy=%2735%27 rx=%2722%27 ry=%2720%27 fill=%27%232b211c%27/%3E%3Cellipse cx=%2732%27 cy=%2744%27 rx=%2712%27 ry=%279%27 fill=%27%23e9b96e%27/%3E%3Cellipse cx=%2732%27 cy=%2739.5%27 rx=%274.6%27 ry=%273.2%27 fill=%27%23120c09%27/%3E%3Ccircle cx=%2723%27 cy=%2730%27 r=%273%27 fill=%27%23fff%27/%3E%3Ccircle cx=%2741%27 cy=%2730%27 r=%273%27 fill=%27%23fff%27/%3E%3Ccircle cx=%2723.7%27 cy=%2730.5%27 r=%271.6%27 fill=%27%23120c09%27/%3E%3Ccircle cx=%2741.7%27 cy=%2730.5%27 r=%271.6%27 fill=%27%23120c09%27/%3E%3Cpath d=%27M27 47.5q5 3.2 10 0%27 stroke=%27%23120c09%27 stroke-width=%271.8%27 fill=%27none%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: clean white board with soft tinted cards. Home = index card + ranking card; stocks/wallet/feed in tabs; a long rounded bar floats above the bottom nav with my total. Single light theme by choice. */
:root{
  --bg:#ffffff; --paper:#f5f5f9; --paper2:#ebebf2; --ink:#17161f; --dim:#747386; --faint:#adacbd; --line:#ececf2;
  --up:#f2414f; --up-bg:#fdeced; --down:#2f78ee; --down-bg:#e9f0fd;
  --violet:#6a4cf5; --violet-bg:#f0edff; --mint:#16b27e; --mint-bg:#e3f6ee; --gold:#f2b300; --gold-bg:#fff6dc;
  --f-body:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-game:var(--f-body);
  --gut-l:max(16px,env(safe-area-inset-left,0px)); --gut-r:max(16px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
[hidden]{display:none!important}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:var(--gut-l);padding-right:var(--gut-r);padding-block:10px calc(150px + env(safe-area-inset-bottom,0px));overflow-x:hidden;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.wrap{max-width:520px;margin-inline:auto}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.g{font-weight:800}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--dim)} .dim{color:var(--dim)}
h2{font-size:18px;font-weight:800;margin:0;letter-spacing:-.02em;text-wrap:balance}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-h small{color:var(--faint);font-size:12.5px;font-weight:600}
.rpager{display:flex;align-items:center;gap:6px}
.rpager button{width:32px;height:32px;border-radius:10px;background:var(--paper);font-size:13px;color:var(--ink)}
.rpager button:disabled{opacity:.3}
.card{background:var(--paper);border-radius:22px}
.press:active{opacity:.7}

/* top bar */
.top{display:flex;align-items:center;gap:8px;padding:4px 0 12px}
.logo{font-size:23px;font-weight:800;letter-spacing:-.04em;line-height:1}
.brand{display:inline-flex;align-items:center;gap:8px}
.bear{width:36px;height:36px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ink);flex:none}
.brand.big{justify-content:center;gap:12px;margin-bottom:4px}.brand.big .bear{width:64px;height:64px}.brand.big .logo{font-size:40px}
.logo i{font-style:normal;color:var(--violet)}
.round{font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--violet-bg);color:var(--violet)}
.helpbtn{margin-left:auto;width:34px;height:34px;border-radius:50%;font-weight:800;font-size:15px;background:var(--paper);color:var(--dim)}

/* timer */
.timer{margin-bottom:4px;display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--ink);color:var(--bg);border-radius:18px}
.timer .lab{font-size:12px;opacity:.6;font-weight:600}
.timer .nm{font-size:15px;font-weight:700}
.timer .cd{margin-left:auto;font-size:22px;font-weight:800;letter-spacing:-.01em}
.rounds{display:flex;gap:3px;margin-top:8px}
.rounds i{flex:1;height:4px;border-radius:2px;background:var(--paper2)}
.rounds i.done{background:var(--violet)} .rounds i.now{background:var(--violet);opacity:.35}
.rounds i.gap{margin-left:4px}

/* index */
.index{padding:18px 18px 12px;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.index .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.index .lab{font-size:13px;font-weight:700;color:var(--dim)}
.index .v{font-size:clamp(34px,10.5vw,42px);font-weight:800;line-height:1.1;letter-spacing:-.03em}
.index .c{font-size:15px;font-weight:700}
.mood{font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:99px;white-space:nowrap;background:var(--bg)}
.mood.up{color:var(--up)} .mood.down{color:var(--down)} .mood.flat{color:var(--dim)}
.ichart{width:100%;height:110px;display:block;margin-top:6px}
.sectors{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.sectors div{background:var(--bg);border-radius:12px;padding:7px 4px;text-align:center;font-size:11.5px;font-weight:600;color:var(--dim);min-width:0}
.sectors b{display:block;font-size:13.5px;font-weight:800}
.idxmini{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px}
.idxmini .lab{font-size:13px;font-weight:800;color:var(--dim);margin-right:8px}
.idxmini b{font-size:26px;font-weight:900;letter-spacing:-.03em;vertical-align:-2px}
.idxmini > .num{font-size:17px;font-weight:900}
.movers{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:-12px}
.mover{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:18px;background:var(--paper);min-width:0}
.mover .mv-main{display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0}
.mover .tbtns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mover .tb{background:var(--bg)}
.mover .tb.sell.lit{background:var(--down);color:#fff}
.mover small{font-size:12px;font-weight:700;color:var(--dim)}
.mover .mn{display:flex;align-items:center;gap:8px;min-width:0}
.mover .mn .logo-b{width:30px;height:30px;font-size:11px;border-radius:9px}
.mover .mn b{font-size:14.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mover .mc{font-size:20px;font-weight:900}
.mover.up{background:var(--up-bg)} .mover.down{background:var(--down-bg)}
.join{display:flex;flex-direction:column;gap:6px;padding:18px;text-align:center;background:var(--violet-bg)}
.join b{font-size:18px;font-weight:800}

/* avatars */
.ava{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:800;color:var(--ink);flex:none}
.ava.lg{width:52px;height:52px;font-size:20px}
.ava .crown{display:none}

/* rival */
.rival{padding:14px 16px;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.rival-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:700}
.rival-top .g{font-size:14px}
.tug{position:relative;height:8px;border-radius:99px;background:var(--down);overflow:hidden}
.tug i{position:absolute;inset:0 auto 0 0;background:var(--up);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.tug::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--bg)}

/* leaderboard */
.lb{display:flex;flex-direction:column;padding:6px;gap:2px}
.lrow{display:grid;grid-template-columns:26px 38px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;width:100%;text-align:left;border-radius:16px}
.lrow.isme{background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--violet)}
.lrow .rk{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--dim)}
.lrow .rk.r1{background:var(--gold);color:#fff} .lrow .rk.r2{background:#a7adbb;color:#fff} .lrow .rk.r3{background:#cf8d5a;color:#fff}
.lrow .who{min-width:0}
.lrow .who b{font-size:15px;font-weight:700}
.lrow .who small{display:block;font-size:12px;color:var(--dim);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .r{text-align:right}
.lrow .r b{font-size:15px;font-weight:800}
.lrow .r small{display:block;font-size:12.5px;font-weight:700}
.mv{font-size:11.5px;font-weight:800;margin-left:4px}
.tag{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:6px;margin-left:4px;vertical-align:2px}
.tag.rv{background:var(--up-bg);color:var(--up)} .tag.bot{background:var(--paper2);color:var(--dim)} .tag.you{background:var(--violet);color:#fff}

/* news */
.news{display:flex;flex-direction:column;gap:6px}
.nrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--paper)}
.src{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--bg);color:var(--dim);white-space:nowrap}
.src.공시{background:var(--mint-bg);color:var(--mint)} .src.기사{background:var(--violet-bg);color:var(--violet)} .src.긴급{background:var(--ink);color:#fff}
.nrow .t{font-size:14.5px;font-weight:700;line-height:1.4}
.nrow .t small{display:block;font-size:12px;font-weight:500;color:var(--dim)}
.nrow.shock{background:var(--gold-bg)}

/* chips */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1 * var(--gut-l)) calc(-1 * var(--gut-r));padding:2px var(--gut-r) 2px var(--gut-l)}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;font-size:13.5px;font-weight:700;padding:7px 13px;border-radius:99px;background:var(--paper);color:var(--dim)}
.chips button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* stock rows */
.slist{display:flex;flex-direction:column}
.srow{display:flex;align-items:center;gap:8px;padding:8px 0}
.srow-main{flex:1;min-width:0;display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:10px;text-align:left}
.srow-main:active{opacity:.6}
.tbtns{display:flex;gap:4px;flex:none}
.tb{font-size:12.5px;font-weight:800;padding:8px 9px;border-radius:10px}
.tb.buy{background:var(--up-bg);color:var(--up)} .tb.sell{background:var(--down-bg);color:var(--down)}
.sname b.hot-long{color:var(--up);font-weight:900} .sname b.hot-short{color:var(--down);font-weight:900}
.postag{display:inline-block;font-size:11.5px;font-weight:900;color:#fff;padding:1px 7px;border-radius:6px;margin-right:5px}
.postag.long{background:var(--up)} .postag.short{background:var(--down)}
.rescue{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--gold-bg);border:2px solid var(--gold)}
.rescue .t{flex:1;min-width:0}.rescue .t b{display:block;font-size:15px;font-weight:900}.rescue .t small{font-size:12.5px;color:var(--dim);font-weight:600}
.rescue button{flex:none;padding:11px 16px;border-radius:12px;background:var(--gold);color:var(--ink);font-weight:900}
.hud{padding:14px;display:flex;flex-direction:column;gap:10px;border:2px solid var(--line)}
.hud.up{border-color:var(--up);background:var(--up-bg)} .hud.down{border-color:var(--down);background:var(--down-bg)}
.hud-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hud-top small{font-size:12px;font-weight:700;color:var(--dim)}
.hud-pnl{font-size:24px;font-weight:900;letter-spacing:-.03em;line-height:1.2}
.hud.up .hud-pnl{color:var(--up)} .hud.down .hud-pnl{color:var(--down)}
.hud-pnl span{font-size:15px}
.hud-all{flex:none;padding:10px 12px;border-radius:14px;background:var(--ink);color:#fff;font-weight:900;font-size:13px;line-height:1.25}
.hud-all.armed{background:var(--up);animation:blink .6s infinite}
.hud-all:disabled,.hud-close:disabled{opacity:.35}
.hud-list{display:flex;flex-direction:column;gap:6px}
.hud-row{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:14px;padding:8px 10px}
.hud-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left}
.hud-main .logo-b{width:34px;height:34px;font-size:11.5px;border-radius:10px}
.hud-main .sname small{font-size:12px;font-weight:600;color:var(--dim);white-space:normal;overflow:visible}
.hud-close{flex:none;padding:8px 10px;border-radius:10px;background:var(--down);color:#fff;font-weight:900;font-size:12px;line-height:1.2}
.gauge{display:block;height:5px;border-radius:9px;background:var(--paper2);overflow:hidden;margin-top:4px}
.gauge i{display:block;height:100%;background:var(--mint)}
.gauge.danger i{background:var(--up)}
.gtxt{display:block;font-size:11px !important}
.postag.spot{background:var(--ink)}
.rowpnl{font-size:12px;font-weight:900;margin-left:4px}
.tb.sell.lit{background:var(--down);color:#fff;box-shadow:0 2px 8px rgba(47,120,238,.35)}
.tb:disabled{opacity:.3;cursor:default}
.sprice .p{border-radius:6px;padding:0 3px;margin-right:-3px}
.sprice .p.fu{animation:fu .9s} .sprice .p.fd{animation:fd .9s}
@keyframes fu{0%{background:var(--up);color:#fff;transform:scale(1.08)}}
@keyframes fd{0%{background:var(--down);color:#fff;transform:scale(1.08)}}
.livedot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--up);margin-left:8px;vertical-align:middle;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.2}}
.seg.two{grid-template-columns:1fr 1fr}
.sheet-wrap.center{align-items:center;padding:16px}
.sheet-wrap.center .sheet{border-radius:24px;max-width:400px;padding:18px 18px 18px;animation:pop .22s}
.sheet-wrap.center .grab{display:none}
.logo-b{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:12.5px;font-weight:800;letter-spacing:-.03em;flex:none}
.sname{min-width:0}
.sname b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sname small{display:block;font-size:12.5px;color:var(--dim);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sname .mine{color:var(--violet);font-weight:700}
.sprice{text-align:right}
.sprice .p{font-size:15px;font-weight:700}
.sprice .c{font-size:13px;font-weight:700}

/* wallet */
.cards2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{padding:14px 16px}
.stat .lab{font-size:12.5px;color:var(--dim);font-weight:600}
.stat .v{font-size:18px;font-weight:800;margin-top:2px}
.pos{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;width:100%;text-align:left}
.pos .r{text-align:right}
.pos .r b{font-weight:800}
.pos small{font-size:12.5px;font-weight:600}
.empty{padding:26px 16px;text-align:center;color:var(--dim);font-size:14px;font-weight:600;background:var(--paper);border-radius:18px}

/* feed */
.fitem{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;font-size:14px}
.fitem .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:14px;background:var(--paper)}
.fitem .ic.up{background:var(--up-bg)} .fitem .ic.down{background:var(--down-bg)} .fitem .ic.gold{background:var(--gold-bg)}
.fitem time{font-size:12px;color:var(--faint);white-space:nowrap;font-weight:600}
.fitem small{color:var(--dim);font-size:12.5px;font-weight:500}
.verdict{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:8px;white-space:nowrap}
.verdict.t{background:var(--mint-bg);color:var(--mint)} .verdict.f{background:var(--up-bg);color:var(--up)} .verdict.g{background:var(--ink);color:#fff}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:6px var(--gut-r) calc(6px + env(safe-area-inset-bottom,0px)) var(--gut-l);background:rgba(255,255,255,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.nav-in{max-width:520px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{padding:6px 4px 4px;font-size:11.5px;font-weight:700;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-selected="true"]{color:var(--ink)}
.nav .dot{position:absolute;top:4px;right:calc(50% - 16px);width:7px;height:7px;border-radius:50%;background:var(--up)}

/* payout */
.bonus{display:flex;align-items:center;gap:12px;padding:14px 16px}
.bonus .t{flex:1;min-width:0}
.bonus .t b{display:block;font-size:15px;font-weight:800}
.bonus .t small{font-size:12.5px;color:var(--dim);font-weight:600}
.bonus button{flex:none;padding:10px 18px;border-radius:12px;background:var(--violet);color:#fff;font-weight:800;font-size:14px}
.bonus button:disabled{background:var(--paper2);color:var(--dim);cursor:default}
.bonus{background:var(--violet-bg)}
.bonus-amt{flex:none;font-size:15px;font-weight:800;color:var(--violet)}
.lb-gap{text-align:center;color:var(--faint);font-weight:800;letter-spacing:.2em;padding:2px 0}

/* casino */
.bal{display:flex;justify-content:space-between;align-items:center;padding:14px 16px}
.bal b{font-size:22px;font-weight:800}
.betrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.betrow button{background:var(--paper);border-radius:12px;padding:10px 0;font-weight:800;font-size:14px;color:var(--dim)}
.betrow button[aria-pressed="true"]{background:var(--ink);color:#fff}
.betrow button[data-bet="1"][aria-pressed="true"]{background:var(--up);color:#fff}
.betrow button:disabled{opacity:.35}
.betin{display:flex;align-items:center;gap:8px;background:var(--paper);border-radius:14px;padding:4px 14px}
.betin input{flex:1;min-width:0;border:0;background:transparent;font-family:var(--f-body);font-size:18px;font-weight:800;padding:10px 0;color:var(--ink)}
.betin span{font-weight:700;color:var(--dim)}
.betnow{margin:0;font-size:13.5px;font-weight:600;color:var(--dim)}
.betnow b{color:var(--ink);font-size:15px}
.game{padding:18px 16px;display:flex;flex-direction:column;gap:12px}
.game h3{margin:0;font-size:17px;font-weight:800}
.game .desc{font-size:12.5px;color:var(--dim);font-weight:500;margin:2px 0 0}
.game .res{text-align:center;font-size:15px;font-weight:700;margin:0;min-height:22px}
.coin{width:104px;height:104px;margin:4px auto 0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe58a,#f2b300 72%);display:grid;place-items:center;font-size:30px;font-weight:800;color:#7a5600;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12)}
.coin.spin{animation:flip .95s cubic-bezier(.3,.7,.4,1)}
@keyframes flip{0%{transform:rotateY(0) translateY(0)}50%{transform:rotateY(900deg) translateY(-34px)}100%{transform:rotateY(1800deg) translateY(0)}}
.pick2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.mapbox{position:relative;margin-inline:calc(-1 * var(--gut-l)) calc(-1 * var(--gut-r))}
.seoul{width:100%;height:min(70vh,520px);display:block;background:#e8f1fb;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}

.seoul:not(.zoomed) .gc{display:none}
.mapctl{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:12px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:40px;height:40px;border-radius:12px;background:var(--bg);box-shadow:0 2px 8px rgba(23,22,31,.15);font-size:20px;font-weight:800}
.mapinfo{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(23,22,31,.78);color:#fff;font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:99px;pointer-events:none;white-space:nowrap}
.owner-tag{color:#fff;padding:1px 7px;border-radius:7px;font-size:11.5px;font-weight:800}
.brag{color:var(--violet);font-weight:800}
.ownercard{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;background:var(--oc);color:#fff;box-shadow:0 8px 24px rgba(23,22,31,.15)}

.ownercard small{display:block;font-size:12.5px;font-weight:700;opacity:.85}

.ownercard.free{background:var(--paper);color:var(--ink)}
.ownercard.free b{font-size:17px;text-shadow:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;font-weight:700;color:var(--dim)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px;box-shadow:0 0 0 1.5px var(--ink)}
.legend i.lb{background:#ffe1e1;box-shadow:0 0 0 1.5px var(--up)}
.est-row{padding:8px 0;width:100%}
canvas.fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}
body.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.fab.pu{animation:pu .7s} .fab.pd{animation:pd .7s}
@keyframes pu{0%{background:#16b27e;transform:scale(1.03)}}
@keyframes pd{0%{background:#f2414f;transform:scale(.98)}}
.sprice .p.fu,.sprice .p.fd{font-weight:900}
.srow.rowfu{animation:rowu .9s}.srow.rowfd{animation:rowd .9s}
@keyframes rowu{0%{background:var(--up-bg)}}@keyframes rowd{0%{background:var(--down-bg)}}
.srow{border-radius:12px;margin-inline:-6px;padding-inline:6px}

/* floating total-asset bar */
.fab{position:fixed;z-index:25;left:0;right:0;margin-inline:auto;width:calc(100% - var(--gut-l) - var(--gut-r));max-width:520px;
  bottom:calc(70px + env(safe-area-inset-bottom,0px));min-height:58px;border-radius:18px;background:var(--ink);color:#fff;
  box-shadow:0 8px 24px rgba(23,22,31,.22);display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:8px 16px;text-align:left;transition:transform .1s}
.fab:active{transform:scale(.98)}
.fab .rk{min-width:40px;height:32px;padding:0 8px;border-radius:10px;background:rgba(255,255,255,.12);display:grid;place-items:center;font-size:14px;font-weight:800}
.fab .rk.r1{background:var(--gold);color:var(--ink)}
.fab .mid{min-width:0;display:flex;flex-direction:column;line-height:1.2}
.fab .l2{font-size:11.5px;font-weight:800;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fab .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fab .l{font-size:11.5px;font-weight:600;opacity:.6}
.fab .v{font-size:18px;font-weight:800}
.fab .c{font-size:15px;font-weight:800;text-align:right}
.fab .c.up{color:#ff7a85} .fab .c.down{color:#7fb0ff} .fab .c.flat{color:rgba(255,255,255,.6)}
.fab .c.buy-prompt{color:var(--gold);font-size:13px;font-weight:800;background:rgba(255,210,63,.16);padding:6px 10px;border-radius:10px;white-space:nowrap;animation:blink 1.6s infinite}
.fab.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.03)}}

/* stock detail page */
.detail{position:fixed;inset:0;z-index:35;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;
  padding:env(safe-area-inset-top,0px) var(--gut-r) calc(96px + env(safe-area-inset-bottom,0px)) var(--gut-l);animation:slidein .22s cubic-bezier(.2,.8,.2,1)}
@keyframes slidein{from{transform:translateX(24px);opacity:0}}
.detail .in{max-width:520px;margin:auto;display:flex;flex-direction:column;gap:18px}
.dtop{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:10px 0;background:var(--bg)}
.dtop .back{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;margin-left:-6px}
.dtop .back svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.dtop b{font-size:16px;font-weight:800}
.dhead{display:flex;gap:12px;align-items:center}
.dhead .logo-b{width:52px;height:52px;font-size:16px;border-radius:15px}
.dhead h1{font-size:22px;font-weight:800;margin:0;letter-spacing:-.02em;line-height:1.2}
.dhead small{color:var(--dim);font-size:13px;font-weight:600}
.dprice .p{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.dprice .c{font-size:15px;font-weight:700;margin-top:2px}
.dchart{width:100%;height:190px;display:block}
.drange{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);font-weight:700;margin-top:-10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats div{background:var(--paper);border-radius:14px;padding:11px 13px;font-size:12.5px;color:var(--dim);font-weight:600;min-width:0}

.mypos{padding:16px;display:flex;flex-direction:column;gap:10px}

.mypos .r span:first-child{color:var(--dim)}
.mypos .r b{font-weight:800}
.dbar{position:fixed;left:0;right:0;bottom:0;z-index:36;padding:10px var(--gut-r) calc(10px + env(safe-area-inset-bottom,0px)) var(--gut-l);background:rgba(255,255,255,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.dbar .in{max-width:520px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cta.lev{background:linear-gradient(135deg,#ff3d6e,#ff9f1c);color:#fff}
.levdir{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.levdir button{padding:11px 0;border-radius:12px;background:var(--paper);font-weight:800;font-size:14px;color:var(--dim)}
.levdir button[aria-pressed="true"][data-levd="long"]{background:var(--up);color:#fff}
.levdir button[aria-pressed="true"][data-levd="short"]{background:var(--down);color:#fff}
.fab .sd{font-weight:900;opacity:1} .fab .sd.up{color:#ff7a85} .fab .sd.down{color:#7fb0ff} .fab .sd.flat{color:#fff}
.levx{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.levx button{padding:10px 0;border-radius:12px;background:var(--paper);font-weight:900;font-size:14.5px;color:var(--dim)}
.levx button[aria-pressed="true"]{background:linear-gradient(135deg,#ff3d6e,#ff9f1c);color:#fff}
.levcard{display:flex;align-items:center;gap:8px;padding:12px 14px;border-radius:14px;background:var(--paper);font-size:13px;font-weight:700}
.levcard span{flex:1;min-width:0;color:var(--dim)}
.levcard b{font-size:20px;font-weight:900}
.levcard.up b{color:var(--up)} .levcard.down b{color:var(--down)}
.levcard button{padding:8px 12px;border-radius:10px;background:var(--ink);color:#fff;font-weight:800}
.pos.has-atk{grid-template-columns:40px minmax(0,1fr) auto auto;gap:8px}
.atk-btn{padding:8px 10px;border-radius:12px;background:linear-gradient(135deg,#f2414f,#ff7a00);color:#fff;font-size:12px;font-weight:900;line-height:1.15;text-align:center;white-space:nowrap;box-shadow:0 3px 10px rgba(242,65,79,.28)}
.atk-btn:disabled{opacity:.35;box-shadow:none}
.atk-btn small{display:block;font-size:10.5px;font-weight:700;opacity:.9;margin-top:2px}
.tag.atk{background:#ffe1e4;color:var(--up)}
.dbar .cta{padding:14px 6px;font-size:15.5px}
body.noscroll{overflow:hidden}
.login{position:fixed;inset:0;z-index:70;background:var(--bg);display:grid;place-items:center;padding:24px var(--gut-r) 24px var(--gut-l)}
.login-in{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px;text-align:center}
.login-sub{margin:0 0 18px;color:var(--dim);font-weight:600}
.cta.google{background:var(--bg);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line);display:flex;align-items:center;justify-content:center;gap:10px}
.cta.google svg{width:20px;height:20px}
.mypos .r span:first-child{font-size:13px}
.vote{padding:16px;display:flex;flex-direction:column;gap:10px}
.vq b{display:block;font-size:15.5px;font-weight:800}
.vq small{font-size:12.5px;color:var(--dim);font-weight:600}
.vbar{height:8px;border-radius:99px;background:var(--down);overflow:hidden}
.vbar i{display:block;height:100%;background:var(--up);transition:width .5s}
.vbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vb{padding:11px;border-radius:12px;font-weight:800;font-size:14.5px;background:var(--bg)}
.vb.up{color:var(--up)} .vb.down{color:var(--down)}
.vb.up.on{background:var(--up);color:#fff} .vb.down.on{background:var(--down);color:#fff}
.vb:disabled{opacity:.45;cursor:default}
.composer{display:flex;gap:8px}
.composer input{flex:1;min-width:0;background:var(--paper);border:0;border-radius:14px;padding:13px 14px;font-family:var(--f-body);font-size:15px;font-weight:600;color:var(--ink)}
.composer button{flex:none;width:48px;border-radius:14px;background:var(--violet);color:#fff;display:grid;place-items:center}
.chat{background:var(--paper);border-radius:20px;padding:12px 12px 8px;height:min(420px,56vh);overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:3px}
.chat-empty{margin:auto;color:var(--dim);font-size:14px;font-weight:600}
.chat-day{align-self:center;font-size:11.5px;font-weight:700;color:var(--faint);padding:8px 0 4px}
.msg{display:flex;gap:8px;align-items:flex-start;max-width:86%;margin-top:6px}
.msg.cont{margin-top:0}
.msg .ava{width:32px;height:32px;font-size:13px}
.ava-sp{width:32px;flex:none}
.msg .mb{min-width:0;display:flex;flex-direction:column;gap:3px}
.msg .mn{font-size:12.5px;font-weight:700;color:var(--dim);display:flex;align-items:center;gap:4px}
.mrow{display:flex;align-items:flex-end;gap:5px}
.bubble{background:var(--bg);padding:8px 12px;border-radius:4px 16px 16px 16px;font-size:14.5px;font-weight:500;line-height:1.45;word-break:break-word;white-space:pre-wrap}
.msg.cont .bubble{border-radius:16px}
.mrow time{font-size:10.5px;color:var(--faint);font-weight:600;white-space:nowrap;flex:none}
.msg.me{align-self:flex-end}
.msg.me .mn{justify-content:flex-end;color:var(--violet)}
.msg.me .mrow{flex-direction:row-reverse}
.msg.me .bubble{background:var(--violet);color:#fff;border-radius:16px 4px 16px 16px}
.msg.me.cont .bubble{border-radius:16px}
.composer button svg{width:20px;height:20px;fill:#fff}
.posts{display:flex;flex-direction:column}
.post{display:grid;grid-template-columns:38px minmax(0,1fr);gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.post:last-child{border-bottom:0}
.post .ph{display:flex;align-items:center;gap:6px;font-size:14px}
.post .ph b{font-weight:800}
.post .ph time{margin-left:auto;font-size:12px;color:var(--faint);font-weight:600}
.post p{margin:3px 0 6px;font-size:15px;font-weight:500;line-height:1.5;word-break:break-word}
.post .pa{display:flex;gap:6px}
.post .like,.post .del{font-size:12.5px;font-weight:700;color:var(--dim);padding:4px 10px;border-radius:99px;background:var(--paper)}
.post .like.on{color:var(--up);background:var(--up-bg)}
.tag.hold{background:var(--violet-bg);color:var(--violet);margin-left:0}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(23,22,31,.4);animation:fade .2s}
.sheet{position:relative;width:100%;max-width:560px;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:26px 26px 0 0;
  padding:10px var(--gut-r) calc(20px + env(safe-area-inset-bottom,0px)) var(--gut-l);animation:rise .26s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--paper2);margin:0 auto 14px}
.sheet .x{position:absolute;right:12px;top:12px;width:32px;height:32px;border-radius:50%;background:var(--paper);color:var(--dim);font-size:18px;line-height:1}
.sbody{display:flex;flex-direction:column;gap:16px}
@keyframes rise{from{transform:translateY(36px);opacity:0}}
@keyframes fade{from{opacity:0}}
.shead{display:flex;gap:12px;align-items:center;padding-right:44px}
.shead .logo-b,.shead .ava{width:48px;height:48px;font-size:15px}
.shead h3{font-size:21px;font-weight:800;margin:0;line-height:1.2;letter-spacing:-.02em}
.shead small{color:var(--dim);font-size:13px;font-weight:500}
.bigp .p{font-size:30px;font-weight:800;line-height:1.15;letter-spacing:-.03em}
.bigp .c{font-size:14px;font-weight:700;margin-top:2px}
.chart{width:100%;height:150px;display:block}
.info{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.info div{background:var(--paper);border-radius:14px;padding:10px 12px;font-size:12.5px;color:var(--dim);font-weight:600;min-width:0}
.info b{display:block;color:var(--ink);font-size:15px;font-weight:800;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--paper);border-radius:14px;padding:3px;gap:3px}
.seg button{padding:9px 2px;border-radius:11px;font-weight:700;font-size:14px;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.seg button[aria-pressed="true"][data-m="buy"]{color:var(--up)}
.seg button[aria-pressed="true"][data-m="sell"]{color:var(--down)}
.qtyrow{display:grid;grid-template-columns:50px 1fr 50px;gap:8px}
.qtyrow button{background:var(--paper);border-radius:14px;font-size:22px;font-weight:700;color:var(--dim)}
.qtyrow input{width:100%;min-width:0;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;color:var(--ink);font-family:var(--f-body);font-size:21px;font-weight:800;text-align:center;padding:10px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.quick button{background:var(--paper);border-radius:12px;padding:8px 0;font-size:13.5px;font-weight:700;color:var(--dim)}
.est{display:flex;justify-content:space-between;font-size:13.5px;color:var(--dim);font-weight:600;gap:8px}

.cta{width:100%;padding:15px;border-radius:16px;font-size:16px;font-weight:800;background:var(--violet);color:#fff;transition:transform .1s,opacity .2s}
.cta:active{transform:scale(.98)}
.cta:disabled{opacity:.3;cursor:not-allowed;transform:none}

.hint{font-size:12.5px;color:var(--dim);line-height:1.55;margin:0;font-weight:500}
.field{display:flex;flex-direction:column;gap:6px}

/* reveal */
.rv-head{text-align:center}

.rv-me{text-align:center;padding:18px}

.rv-rank{font-size:16px;font-weight:800;margin-top:4px}
.overtake{padding:12px 14px;border-radius:14px;font-size:14px;font-weight:700}
.overtake.bad{background:var(--up-bg);color:var(--up)} .overtake.good{background:var(--mint-bg);color:var(--mint)}
.rv-row{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:6px 0;animation:pop .4s both}

async function creditRent() {

// Firebase: Google login + Firestore, wrapped to the same small API the game already uses
const FB_V = '10.12.2';
async function firebaseBackend(cfg) {
  const base = `https://www.gstatic.com/firebasejs/${FB_V}/`;
  const [appM, fsM, auM] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-firestore.js'), import(base + 'firebase-auth.js')]);
  const app = appM.initializeApp(cfg); const fs = fsM.getFirestore(app); const auth = auM.getAuth(app);
  const wrapQ = q => ({
    orderBy: (f, d) => wrapQ(fsM.query(q, fsM.orderBy(f, d))),
    limit: n => wrapQ(fsM.query(q, fsM.limit(n))),
    onSnapshot: (next, err) => fsM.onSnapshot(q, next, err),
    add: d => fsM.addDoc(q, d),
  });
  const mapErr = e => { if (e && e.code === 'permission-denied') e.code = 'invalid_argument'; throw e; };
  const db = {
    collection: path => wrapQ(fsM.collection(fs, path)),
    doc: path => { const r = fsM.doc(fs, path); return {
      set: d => fsM.setDoc(r, d).catch(mapErr),
      update: d => fsM.setDoc(r, d, { merge: true }).catch(mapErr),
      delete: () => fsM.deleteDoc(r).catch(mapErr),
    }; },
  };
  return {
    db,
    onUser: cb => auM.onAuthStateChanged(auth, cb),
    signIn: async () => { const pr = new auM.GoogleAuthProvider(); try { await auM.signInWithPopup(auth, pr); } catch (e) { if (e && (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment')) await auM.signInWithRedirect(auth, pr); else throw e; } },
    signOut: () => auM.signOut(auth),
  };
}

  }, () => {});
}
async function boot() {
  syncTime(); S.lastLive = liveStep(now()); S.betPct = LS.get('betPct', '0.1'); if (S.betPct === 'custom') S.betPct = '0.1'; S.slot = slotOf(now()); S.rival = LS.get('rival', null); S.feedSeen = LS.get('feedSeen', 0); renderAll();

  }

  if (t.hasAttribute('data-player')) { openSheet('player', { id: t.dataset.player }); return; }

  if (t.dataset.frac) { const mx = maxQty(S.sheet.m, S.sheet.sym); $('#qty').value = Math.floor(mx * +t.dataset.frac); updateTradeEst(); return; }
  switch (t.id) {
    case 'helpBtn': openSheet('help'); break;
    case 'estAct': estAction(); break;
    case 'rescueBtn': claimRescue(); break;
    case 'closeAllBtn': if (S.closeAllAt && Date.now() - S.closeAllAt < 4000) closePositions(() => true); else { S.closeAllAt = Date.now(); renderAll(); } break;
    case 'zoomIn': zoomAt(1.6, S.mapV.x + S.mapV.w / 2, S.mapV.y + S.mapV.h / 2, true); break;
    case 'zoomOut': zoomAt(1 / 1.6, S.mapV.x + S.mapV.w / 2, S.mapV.y + S.mapV.h / 2, true); break;
    case 'zoomReset': { const h = MAP.w0 * mapAR(); S.mapV = { x: MAP.x0, y: MAP.y0 + MAP.h0 / 2 - h / 2, w: MAP.w0, h }; applyMapView(); break; }
    case 'googleBtn': t.disabled = true; S.fb.signIn().catch(() => toast('로그인하지 못했어요. 다시 시도해 주세요.')).finally(() => { t.disabled = false; }); break;
    case 'demoBtn': $('#login').hidden = true; document.body.classList.remove('noscroll'); startDemo(); break;
    case 'logoutBtn': S.fb.signOut().then(() => location.reload()); break;
    case 'detailBack': closeDetail(); break;
    case 'talkSend': postTalk(); break;
    case 'spinBtn': playCasino('wheel'); break;
    case 'sheetX': case 'revealOk': closeSheet(); break;
    case 'doTrade': doTrade(); break;
    case 'joinBtn': doJoin(); break;
    case 'spyBtn': doSpy(S.sheet.id); break;
    case 'rivalBtn': S.rival = S.rival === S.sheet.id ? null : S.sheet.id; LS.set('rival', S.rival); toast(S.rival ? '⚔️ 라이벌 지정! 홈 화면에 줄다리기가 떠요' : '라이벌을 해제했어요'); renderAll(); renderSheet(); break;
  }
